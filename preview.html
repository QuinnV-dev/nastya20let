
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf4df">
<title>Дорогая Настя!</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ==============================
   ОСНОВНЫЕ НАСТРОЙКИ
================================ */

:root {
    --cream: #fff9e9;
    --cream-dark: #f5edda;
    --mint: #dcefdc;
    --mint-light: #edf6e9;
    --green: #8aaf87;
    --green-dark: #66896b;
    --green-deep: #55775c;
    --pink: #f3c5bd;
    --gold: #e9ca83;
    --text: #637b60;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100svh;
    overflow-x: hidden;
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at 15% 15%, rgba(255,255,255,.9), transparent 40%),
        radial-gradient(ellipse at 85% 80%, rgba(196,225,187,.55), transparent 45%),
        linear-gradient(145deg, #eff5e5, #e3efdf 45%, #f8f0db);
}

/* ==============================
   ФОНОВАЯ АТМОСФЕРА
================================ */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(55px);
    opacity: .45;
    animation: glowMove 12s ease-in-out infinite alternate;
}

.glow.one {
    width: 280px;
    height: 280px;
    background: #fff6c9;
    top: 5%;
    left: -100px;
}

.glow.two {
    width: 350px;
    height: 350px;
    background: #c9e8c5;
    bottom: 0;
    right: -120px;
    animation-delay: -5s;
}

.glow.three {
    width: 200px;
    height: 200px;
    background: #f7dcd2;
    top: 45%;
    left: 45%;
    opacity: .22;
}

@keyframes glowMove {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(35px, -25px) scale(1.2); }
}

/* ==============================
   ПЛАВАЮЩИЕ ДЕКОРАЦИИ
================================ */

.particle {
    position: absolute;
    pointer-events: none;
    animation: floatParticle linear infinite;
    opacity: .65;
}

.particle.leaf {
    width: 18px;
    height: 11px;
    background: #a6c99b;
    border-radius: 100% 0 100% 0;
    transform: rotate(-30deg);
}

.particle.star {
    color: #e4bd65;
    font-size: 18px;
    text-shadow: 0 0 12px #ffe9a8;
}

.particle.heart {
    color: #e8aaa5;
    font-size: 17px;
}

@keyframes floatParticle {
    0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: .7; }
    85% { opacity: .6; }
    100% {
        transform: translateY(-15vh) rotate(240deg);
        opacity: 0;
    }
}

/* ==============================
   ОСНОВНОЙ ЭКРАН
================================ */

.page {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 45px 18px;
}

.scene {
    position: relative;
    width: min(100%, 760px);
    min-height: 650px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ==============================
   ДЕКОРАТИВНАЯ РАМКА
================================ */

.card {
    position: relative;
    width: 100%;
    min-height: 460px;
    padding: 80px 48px 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;

    background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.95), transparent 75%),
        linear-gradient(145deg, rgba(255,253,241,.94), rgba(246,249,230,.92));

    border: 2px solid rgba(255,255,255,.9);
    border-radius: 48% 48% 35px 35px / 12% 12% 35px 35px;

    box-shadow:
        0 25px 70px rgba(95,130,88,.12),
        inset 0 0 35px rgba(255,255,255,.8);

    animation: cardAppear 1.3s ease both;
}

.card::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(157,190,143,.4);
    border-radius: inherit;
    pointer-events: none;
}

.card::after {
    content: "✧";
    position: absolute;
    top: 30px;
    color: var(--gold);
    font-size: 26px;
    text-shadow: 0 0 15px #f4d99b;
    animation: sparkle 3s ease-in-out infinite;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes sparkle {
    0%, 100% { opacity: .5; transform: scale(.8) rotate(0); }
    50% { opacity: 1; transform: scale(1.3) rotate(25deg); }
}

/* ==============================
   ТЕКСТ
================================ */

.text-content {
    position: relative;
    z-index: 2;
    max-width: 560px;
}

.heading {
    font-family: 'Comfortaa', sans-serif;
    font-size: clamp(30px, 6vw, 48px);
    line-height: 1.4;
    font-weight: 700;
    color: var(--green-deep);
    margin-bottom: 25px;
    opacity: 0;
    animation: textAppear 1s ease .6s forwards;
    text-shadow: 0 3px 15px rgba(139,174,125,.18);
}

.heading::after {
    content: "❀";
    display: block;
    font-size: 25px;
    color: #d6b77c;
    margin-top: 12px;
}

.message {
    font-size: clamp(17px, 3.2vw, 21px);
    line-height: 1.9;
    font-weight: 600;
    color: #748b70;
    opacity: 0;
    animation: textAppear 1.2s ease 1s forwards;
}

@keyframes textAppear {
    from {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* ==============================
   КОТИКИ SVG
================================ */

.cat {
    position: absolute;
    z-index: 3;
    width: 125px;
    height: 125px;
    overflow: visible;
    animation: catFloat 4s ease-in-out infinite;
    cursor: pointer;
    transform-origin: center bottom;
    transition: filter .3s ease;
}

.cat:hover {
    filter: drop-shadow(0 5px 10px rgba(117,157,104,.3));
}

.cat:active {
    animation: catWiggle .5s ease;
}

.cat-one {
    bottom: -40px;
    left: -45px;
    animation-delay: -.5s;
}

.cat-two {
    bottom: -35px;
    right: -40px;
    animation-delay: -2s;
}

.cat-three {
    width: 95px;
    height: 95px;
    top: -45px;
    right: 40px;
    animation-delay: -1s;
}

@keyframes catFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
}

@keyframes catWiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-12deg); }
    75% { transform: rotate(12deg); }
}

/* ==============================
   ЛИСТЬЯ И МАЛЕНЬКИЕ УКРАШЕНИЯ
================================ */

.decoration {
    position: absolute;
    pointer-events: none;
    color: #b2cda1;
    opacity: .8;
}

.decoration.top-left {
    top: 20px;
    left: 15px;
    font-size: 40px;
    transform: rotate(-25deg);
}

.decoration.bottom-right {
    bottom: 15px;
    right: 15px;
    font-size: 38px;
    transform: rotate(35deg);
}

.decoration.left-star {
    left: 8%;
    top: 35%;
    font-size: 25px;
    color: #e8c879;
}

.decoration.right-star {
    right: 8%;
    top: 60%;
    font-size: 22px;
    color: #e8c879;
}

/* ==============================
   ДЕКОРАТИВНЫЕ ВЕТВИ
================================ */

.branch {
    position: absolute;
    width: 110px;
    height: 110px;
    opacity: .55;
    pointer-events: none;
}

.branch.left {
    top: 35px;
    left: -25px;
    transform: rotate(-35deg);
}

.branch.right {
    bottom: 40px;
    right: -25px;
    transform: rotate(145deg);
}

/* ==============================
   АДАПТИВНОСТЬ
================================ */

@media (max-width: 600px) {
    .page {
        padding: 65px 18px 75px;
        min-height: 100svh;
    }

    .scene {
        min-height: 570px;
    }

    .card {
        min-height: 430px;
        padding: 75px 25px 100px;
        border-radius: 42% 42% 32px 32px / 10% 10% 32px 32px;
    }

    .heading {
        font-size: clamp(27px, 8vw, 38px);
        margin-bottom: 20px;
    }

    .message {
        font-size: clamp(16px, 4.2vw, 19px);
        line-height: 1.85;
    }

    .cat {
        width: 105px;
        height: 105px;
    }

    .cat-one {
        left: -20px;
        bottom: -45px;
    }

    .cat-two {
        right: -20px;
        bottom: -40px;
    }

    .cat-three {
        width: 80px;
        height: 80px;
        right: 15px;
        top: -35px;
    }

    .decoration.top-left {
        font-size: 30px;
    }

    .decoration.bottom-right {
        font-size: 30px;
    }

    .branch {
        width: 75px;
        height: 75px;
    }

    .branch.left {
        left: -10px;
    }

    .branch.right {
        right: -10px;
    }
}

@media (max-width: 360px) {
    .card {
        padding-left: 19px;
        padding-right: 19px;
        min-height: 400px;
    }

    .message {
        font-size: 16px;
    }

    .cat {
        width: 85px;
        height: 85px;
    }
}

@media (min-width: 1000px) {
    .scene {
        width: 780px;
        min-height: 720px;
    }

    .card {
        min-height: 510px;
        padding: 90px 75px 120px;
    }

    .cat-one {
        left: -65px;
        bottom: -30px;
    }

    .cat-two {
        right: -65px;
        bottom: -30px;
    }
}

/* ==============================
   ДОСТУПНОСТЬ
================================ */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<!-- Фон -->

<main class="page">

                <ellipse cx="51" cy="119" rx="12" ry="8" fill="#F6E9D5"/>
                <ellipse cx="92" cy="119" rx="12" ry="8" fill="#F6E9D5"/>

                <!-- Уши -->
                <path d="M34 55 L37 16 Q40 5 51 20 L64 42Z" fill="#E9D7BD" stroke="#B58D6B" stroke-width="2"/>
                <path d="M76 42 L94 18 Q105 7 108 21 L105 60Z" fill="#E9D7BD" stroke="#B58D6B" stroke-width="2"/>
                <path d="M42 43 L43 25 L54 43Z" fill="#EAAEAD"/>

                <!-- Усы -->
                <path d="M43 76 L27 73 M44 82 L29 85 M98 76 L114 73 M98 82 L113 85"

                <path d="M108 25 Q112 15 119 20 Q113 27 108 25Z" fill="#B5CC98"/>

            <!-- КОТИК №2 -->
            <svg class="cat cat-two" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Милый котик">

                <path d="M40 108 Q10 116 16 85 Q19 71 30 77"

                <path d="M81 68 Q87 59 94 68" fill="none" stroke="#617A60" stroke-width="3" stroke-linecap="round"/>

                <!-- Нос -->

<script>
/* ==============================
   ПЛАВАЮЩИЕ ЧАСТИЦЫ
================================ */

const background = document.getElementById('background');

const particleTypes = ['leaf', 'star', 'heart'];

function createParticle() {
    const particle = document.createElement('div');
    const type = particleTypes[
        Math.floor(Math.random() * particleTypes.length)
    ];

    particle.classList.add('particle', type);

    if (type === 'star') {
        particle.textContent = Math.random() > 0.5 ? '✧' : '✦';
    } else if (type === 'heart') {
        particle.textContent = '♡';
    }

    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDuration = (12 + Math.random() * 14) + 's';
    particle.style.animationDelay = (Math.random() * 8) + 's';
    particle.style.opacity = (0.25 + Math.random() * 0.5).toString();

    if (type === 'leaf') {
        particle.style.background = Math.random() > 0.5
            ? '#A7C99A'
            : '#C2D9A9';
    }

    background.appendChild(particle);

    setTimeout(() => {
        particle.remove();
    }, 28000);
}

// Создание начальных частиц
for (let i = 0; i < 20; i++) {
    createParticle();
}

// Периодическое появление новых частиц
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(createParticle, 1500);
}

/* ==============================
   СЕРДЕЧКИ ПРИ КАСАНИИ
================================ */

document.addEventListener('pointerdown', (event) => {
    const heart = document.createElement('div');

    heart.textContent = Math.random() > 0.5 ? '♡' : '✧';

    heart.style.position = 'fixed';
    heart.style.left = event.clientX + 'px';
    heart.style.top = event.clientY + 'px';
    heart.style.transform = 'translate(-50%, -50%)';
    heart.style.color = Math.random() > 0.5 ? '#E6A6A5' : '#D9BA72';
    heart.style.fontSize = (15 + Math.random() * 14) + 'px';
    heart.style.pointerEvents = 'none';
    heart.style.zIndex = '100';
    heart.style.transition = 'all 1.1s ease-out';

    document.body.appendChild(heart);

    requestAnimationFrame(() => {
        heart.style.top = (event.clientY - 65) + 'px';
        heart.style.opacity = '0';
        heart.style.transform =
            `translate(-50%, -50%) rotate(${Math.random() * 40 - 20}deg) scale(1.5)`;
    });

    setTimeout(() => heart.remove(), 1200);
});

/* ==============================
   ПОКАЧИВАНИЕ КОТИКОВ
================================ */

document.querySelectorAll('.cat').forEach(cat => {
    cat.addEventListener('click', () => {
        cat.animate(
            [
                { transform: 'rotate(0deg) scale(1)' },
                { transform: 'rotate(-10deg) scale(1.08)' },
                { transform: 'rotate(10deg) scale(1.08)' },
                { transform: 'rotate(0deg) scale(1)' }
            ],
            {
                duration: 550,
                easing: 'ease-in-out'
            }
        );
    });
});
</script>

</body>
</html>
